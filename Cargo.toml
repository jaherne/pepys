[package]
name = "pepys"
version = "0.1.1"
edition = "2024"
authors = ["jonathan aherne"]
description = "A command history tool that records shell commands with metadata"
license = "MIT"
homepage = "https://github.com/jaherne/pepys"
repository = "https://github.com/jaherne/pepys/"
documentation = "https://github.com/jaherne/pepys/"
exclude = ["install.sh"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1.0"
dirs = "5.0"
toml = "0.8"

[dev-dependencies]
tempfile = "3.10"
